name: Apply Vellum ZIP fix
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh fix-vellum-zip.sh
      - run: grep -q 'zipFiles:null' index.html && grep -q '150 \* 1024 \* 1024' index.html
      - run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add index.html && git diff --cached --quiet || git commit -m 'Fix Vellum ZIP project saving'
      - run: git push
