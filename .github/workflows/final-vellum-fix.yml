name: Final Vellum fix
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sed -i 's/11150 \* 1024 \* 1024/150 * 1024 * 1024/g' index.html
      - run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add index.html && git diff --cached --quiet || git commit -m 'Correct Vellum 150MB limit'
      - run: git push
