name: Vellum size fix
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh fix-vellum.sh
      - run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add index.html && git diff --cached --quiet || git commit -m 'Set Vellum HTML limit to 150MB'
      - run: git push
