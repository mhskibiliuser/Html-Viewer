<script type="text/babel" data-presets="react">

var DB_NAME = 'vellum-db';
var STORE_NAME = 'files';

function dbOpen() {
  return new Promise(function (resolve, reject) {
    try {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    } catch (err) {
      reject(err);
    }
  });
}

async function dbPut(record) {
  var db = await dbOpen();
  return new Promise(function (resolve, reject) {
    try {
      var tx = db.transaction(STORE_NAME, 'readwrite');
      var req = tx.objectStore(STORE_NAME).put(record);
      var settled = false;
      function fail(err) { if (!settled) { settled = true; reject(err || new Error('IndexedDB write failed')); } }
      req.onerror = function () { fail(req.error); };
      tx.oncomplete = function () { if (!settled) { settled = true; resolve(); } };
      tx.onerror = function () { fail(tx.error || req.error); };
      tx.onabort = function () { fail(tx.error || req.error || new Error('IndexedDB transaction aborted')); };
    } catch (err) { reject(err); }
  });
}

async function dbGetAll() {
  var db = await dbOpen();
  return new Promise(function (resolve, reject) {
    try {
      var tx = db.transaction(STORE_NAME, 'readonly');
      var req = tx.objectStore(STORE_NAME).getAll();
      req.onsuccess = function () { resolve(req.result || []); };
      req.onerror = function () { reject(req.error); };
    } catch (err) {
      reject(err);
    }
  });
}

async function dbDelete(id) {
  var db = await dbOpen();
  return new Promise(function (resolve, reject) {
    try {
      var tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(id);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    } catch (err) {
      reject(err);
    }
  });
}

function genId() {
  try {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
  } catch (e) {}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    var r = (Math.random() * 16) | 0;
    var v = c === 'x' ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

function App() {
  var _files = React.useState([]), files = _files[0], setFiles = _files[1];
  var _uploads = React.useState([]), uploads = _uploads[0], setUploads = _uploads[1];

  React.useEffect(function () {
    (async function () {
      try {
        var all = await dbGetAll();
        setFiles(all || []);
      } catch (err) {
        console.error('Failed to load files', err);
        setFiles([]);
        showToast('Could not load saved files', 'error');
      }
    })();
  }, []);

  function updateUpload(id, patch) {
    setUploads(function (list) { return list.map(function (u) { return u.id === id ? Object.assign({}, u, patch) : u; }); });
    if (patch.status === 'done' || patch.status === 'error') {
      setTimeout(function () {
        setUploads(function (list) { return list.filter(function (u) { return u.id !== id; }); });
      }, 2600);
    }
  }

  function animateProgress(id, cb) {
    var pct = 0;
    var timer = setInterval(function () {
      pct += Math.random() * 18 + 8;
      if (pct >= 90) {
        pct = 90;
        clearInterval(timer);
        setUploads(function (list) { return list.map(function (u) { return u.id === id ? Object.assign({}, u, { progress: Math.round(pct) }) : u; }); });
        cb();
        return;
      }
      setUploads(function (list) { return list.map(function (u) { return u.id === id ? Object.assign({}, u, { progress: Math.round(pct) }) : u; }); });
    }, 120);
  }

  function uploadFile(file) {
    var MAX_SIZE = 11150 * 1024 * 1024;
    if (file.size > MAX_SIZE) {
      showToast(file.name + ' is too large (150 MB max)', 'error');
      return;
    }
    var id = genId();
    setUploads(function (list) { return list.concat([{ id: id, name: file.name, progress: 0, status: 'uploading' }]); });
    animateProgress(id, async function () {
      var isZip = /\.zip$/i.test(file.name);
      try {
        if (isZip) {
          await processZipFile(file, id);
        } else {
          var record = {
            id: id, name: file.name, type: file.type || 'text/html', size: file.size, blob: file,
            isZip: false, zipFiles: null, indexHtmlPath: null,
            addedAt: Date.now(), openCount: 0, trashed: false, trashedAt: null, allowStorage: false
          };
          await dbPut(record);
          setFiles(function (fs) { return fs.concat([record]); });
          updateUpload(id, { progress: 100, status: 'done' });
          showToast(file.name + ' saved', 'success');
        }
      } catch (err) {
        console.error(err);
        updateUpload(id, { status: 'error' });
        showToast('Could not save ' + file.name, 'error');
      }
    });
  }

  async function processZipFile(zipBlob, id) {
    if (!window.JSZip) throw new Error('JSZip library not loaded');
    if (zipBlob.size > 11150 * 1024 * 1024) throw new Error('ZIP is too large (150 MB max)');
    var zip = await window.JSZip.loadAsync(zipBlob);
    var indexHtmlPath = null;
    zip.forEach(function(path, file) {
      if (!file.dir && !/^__MACOSX\//i.test(path) && !indexHtmlPath && /(^|\/)index\.html?$/i.test(path)) indexHtmlPath = path.replace(/^\.\//,'');
    });
    if (!indexHtmlPath) throw new Error('ZIP does not contain index.html or index.htm');
    var record = {
      id: id, name: zipBlob.name, type: 'application/zip', size: zipBlob.size, blob: zipBlob,
      isZip: true, zipFiles: null, indexHtmlPath: indexHtmlPath,
      addedAt: Date.now(), openCount: 0, trashed: false, trashedAt: null, allowStorage: false
    };
    await dbPut(record);
    setFiles(function(fs) { return fs.concat([record]); });
    updateUpload(id, {progress:100, status:'done'});
    showToast(zipBlob.name + ' saved as project', 'success');
  }

  function handleFiles(list) {
    if (!list || !list.length) return;
    Array.prototype.forEach.call(list, function (f) {
      var isHtml = /\.html?$/i.test(f.name) || f.type === 'text/html';
      var isZip = /\.zip$/i.test(f.name);
      if (!isHtml && !isZip) { showToast(f.name + ' must be .html, .htm, or .zip', 'error'); return; }
      uploadFile(f);
    });
  }

  var fileInputRef = React.useRef(null);
  var _drag = React.useState(false), dragOver = _drag[0], setDragOver = _drag[1];
  var _search = React.useState(''), search = _search[0], setSearch = _search[1];
  var _drawer = React.useState(null), drawer = _drawer[0], setDrawer = _drawer[1];
  var _preview = React.useState(null),
    preview = _preview[0], setPreview = _preview[1];
  var _confirm = React.useState(null), confirmId = _confirm[0], setConfirmId = _confirm[1];

  var activeFiles = files.filter(function (f) { return !f.trashed; });
  var trashedFiles = files.filter(function (f) { return f.trashed; });

  function sortList(list) {
    return list.slice().sort(function (a, b) {
      if ((b.openCount || 0) !== (a.openCount || 0)) return (b.openCount || 0) - (a.openCount || 0);
      return a.name.localeCompare(b.name);
    });
  }

  var visibleSaved = sortList(activeFiles).filter(function (f) {
    return f.name.toLowerCase().indexOf(search.toLowerCase()) !== -1;
  });
  var visibleTrash = sortList(trashedFiles);

  var totalSize = activeFiles.reduce(function (sum, f) { return sum + (f.size || 0); }, 0);
  var totalOpens = files.reduce(function (sum, f) { return sum + (f.openCount || 0); }, 0);

  async function openFile(f) {
    try {
      var updated = Object.assign({}, f, {openCount:(f.openCount || 0) + 1});
      await dbPut(updated);
      setFiles(function(fs) { return fs.map(function(x) { return x.id === f.id ? updated : x; }); });
      var url;
      var blobUrls = {};
      if (updated.isZip) {
        if (!window.JSZip) throw new Error('JSZip library not loaded');
        var zip = await window.JSZip.loadAsync(updated.blob);
        var zipFiles = {};
        var jobs = [];
        zip.forEach(function(path, file) {
          if (file.dir || /^__MACOSX\//i.test(path)) return;
          var clean = path.replace(/^\.\//,'');
          jobs.push(file.async('blob').then(function(blob) { zipFiles[clean] = blob; }));
        });
        await Promise.all(jobs);
        var entry = updated.indexHtmlPath || Object.keys(zipFiles).find(function(p){ return /(^|\/)index\.html?$/i.test(p); });
        if (!entry || !zipFiles[entry]) throw new Error('index.html not found in saved ZIP');
        var htmlText = await blobToText(zipFiles[entry]);
        var processedHtml = processZipHtml(htmlText, zipFiles, blobUrls, entry);
        url = URL.createObjectURL(new Blob([processedHtml], {type:'text/html; charset=utf-8'}));
      } else {
        url = URL.createObjectURL(updated.blob);
      }
      setPreview({file:updated, allowStorage:!!updated.allowStorage, url:url, blobUrls:blobUrls});
      setDrawer(null);
    } catch (err) {
      console.error(err);
      var reason = err && (err.name === 'QuotaExceededError' || /quota|storage/i.test(err.message || ''))
        ? 'Not enough browser storage to save this project'
        : (err && err.message ? err.message : 'unknown error');
      showToast('Could not open/save ' + f.name + ': ' + reason, 'error');
    }
  }

  function blobToText(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = function () { reject(reader.error); };
      reader.readAsText(blob);
    });
  }

  function processZipHtml(html, zipFiles, blobUrls, basePath) {
    var baseDir = basePath.split('/').slice(0, -1).join('/');
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');
    
    function resolvePath(relPath) {
      if (relPath.startsWith('http://') || relPath.startsWith('https://') || relPath.startsWith('//')) {
        return relPath;
      }
      
      var parts = baseDir.split('/').filter(Boolean);
      var target = relPath.split('/');
      
      while (target[0] === '..') {
        target.shift();
        parts.pop();
      }
      
      while (target[0] === '.' || target[0] === '') {
        target.shift();
      }
      
      var resolvedPath = (parts.length > 0 ? parts.join('/') + '/' : '') + target.join('/');
      return resolvedPath;
    }

    function createBlobUrl(path) {
      if (blobUrls[path]) return blobUrls[path];
      var blob = zipFiles[path];
      if (!blob) return null;
      var blobUrl = URL.createObjectURL(blob);
      blobUrls[path] = blobUrl;
      return blobUrl;
    }

    Array.from(doc.querySelectorAll('script[src], link[href], img[src], video[src], audio[src], source[src], iframe[src]')).forEach(function (el) {
      var attr = el.getAttribute('src') || el.getAttribute('href');
      if (!attr) return;
      var resolved = resolvePath(attr);
      var blobUrl = createBlobUrl(resolved);
      if (blobUrl) {
        if (el.hasAttribute('src')) el.setAttribute('src', blobUrl);
        if (el.hasAttribute('href')) el.setAttribute('href', blobUrl);
      }
    });

    Array.from(doc.querySelectorAll('a[href]')).forEach(function (el) {
      var href = el.getAttribute('href');
      if (href && !href.startsWith('#') && !href.startsWith('http') && !href.startsWith('//') && /\.html?$/i.test(href)) {
        var resolved = resolvePath(href);
        var blobUrl = createBlobUrl(resolved);
        if (blobUrl) el.setAttribute('href', blobUrl);
      }
    });

    Array.from(doc.querySelectorAll('[srcset]')).forEach(function (el) {
      var srcset = el.getAttribute('srcset');
      if (!srcset) return;
      var updated = srcset.split(',').map(function (part) {
        var pieces = part.trim().split(/\s+/);
        var src = pieces[0];
        var descriptor = pieces.slice(1).join(' ');
        var resolved = resolvePath(src);
        var blobUrl = createBlobUrl(resolved);
        return (blobUrl || src) + (descriptor ? ' ' + descriptor : '');
      }).join(', ');
      el.setAttribute('srcset', updated);
    });

    var styleElements = doc.querySelectorAll('style');
    for (var i = 0; i < styleElements.length; i++) {
      var style = styleElements[i];
      if (style.textContent) {
        style.textContent = processZipCss(style.textContent, resolvePath, createBlobUrl);
      }
    }

    return doc.documentElement.outerHTML;
  }

  function processZipCss(css, resolvePath, createBlobUrl) {
    return css.replace(/url\s*\(\s*["']?([^"')]+)["']?\s*\)/g, function (match, url) {
      if (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('//') || url.startsWith('data:')) {
        return match;
      }
      var resolved = resolvePath(url);
      var blobUrl = createBlobUrl(resolved);
      return 'url(' + (blobUrl || url) + ')';
    });
  }

  function closePreview() {
    if (preview) {
      try { URL.revokeObjectURL(preview.url); } catch (e) {}
      if (preview.blobUrls) {
        Object.keys(preview.blobUrls).forEach(function (key) {
          try { URL.revokeObjectURL(preview.blobUrls[key]); } catch (e) {}
        });
      }
    }
    setPreview(null);
  }

  async function togglePreviewStorage() {
    if (!preview) return;
    var next = !preview.allowStorage;
    setPreview(Object.assign({}, preview, { allowStorage: next }));
    try {
      var updated = Object.assign({}, preview.file, { allowStorage: next });
      await dbPut(updated);
      setFiles(function (fs) { return fs.map(function (x) { return x.id === updated.id ? updated : x; }); });
    } catch (err) {
      console.error(err);
      showToast('Could not save storage preference', 'error');
    }
  }

  function openInNewTab() {
    if (!preview) return;
    var w = window.open(preview.url, '_blank', 'noopener');
    if (!w) showToast('Pop-up blocked — allow pop-ups to open in a new tab', 'info');
  }

  async function moveToTrash(f) {
    try {
      var updated = Object.assign({}, f, { trashed: true, trashedAt: Date.now() });
      await dbPut(updated);
      setFiles(function (fs) { return fs.map(function (x) { return x.id === f.id ? updated : x; }); });
      showToast(f.name + ' moved to trash', 'info');
    } catch (err) {
      console.error(err);
      showToast('Could not delete ' + f.name, 'error');
    }
  }

  async function restoreFile(f) {
    try {
      var updated = Object.assign({}, f, { trashed: false, trashedAt: null });
      await dbPut(updated);
      setFiles(function (fs) { return fs.map(function (x) { return x.id === f.id ? updated : x; }); });
      showToast(f.name + ' restored', 'success');
    } catch (err) {
      console.error(err);
      showToast('Could not restore ' + f.name, 'error');
    }
  }

  async function deleteForever(id) {
    try {
      await dbDelete(id);
      setFiles(function (fs) { return fs.filter(function (x) { return x.id !== id; }); });
      showToast('File permanently deleted', 'success');
    } catch (err) {
      console.error(err);
      showToast('Could not delete file', 'error');
    } finally {
      setConfirmId(null);
    }
  }

  function fmtSize(n) {
    if (!n) return '0 KB';
    var kb = n / 1024;
    if (kb < 1024) return kb.toFixed(1) + ' KB';
    return (kb / 1024).toFixed(1) + ' MB';
  }

  function onDrop(e) {
    e.preventDefault();
    setDragOver(false);
    handleFiles(e.dataTransfer.files);
  }

  return (
    <React.Fragment>
      <div className="scroll-progress" aria-hidden="true"></div>
      <div className="ambient-glow" aria-hidden="true"></div>
      <div className="ambient-glow ambient-glow--reverse" aria-hidden="true"></div>
      <div className="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

      <header className="topbar">
        <div className="brand">
          <span className="brand-mark">V</span>
          <span className="brand-name">Vellum</span>

        <nav className="topnav">
          <button className="nav-btn" onClick={function () { setDrawer('saved'); }}>
            <i className="ti ti-folder"></i>
            <span>Saved files</span>

          <p className="hero-sub reveal">

          <div

            onDrop={onDrop}
          >
            <i className="ti ti-upload dropzone-icon"></i>
            <p>Drag &amp; drop an HTML file here, or</p>
            <button className="btn btn-primary" onClick={function () { fileInputRef.current && fileInputRef.current.click(); }}>

          <div className="stats-row reveal">
            <div className="stat">
              <span className="stat-num" data-to={activeFiles.length}>0</span>
              <span className="stat-label">files stored</span>
            </div>
            <div className="stat">
              <span className="stat-num" data-to={Math.round(totalSize / 1024)} data-suffix=" KB">0</span>
              <span className="stat-label">total size</span>
            </div>
            <div className="stat">
              <span className="stat-num" data-to={totalOpens}>0</span>
              <span className="stat-label">times opened</span>
            </div>
          </div>
        </section>

        {uploads.length > 0 && (
          <section className="upload-bar-wrap">
            <div className="upload-bar-panel">
              {uploads.map(function (u) {
                return (
                  <div className="upload-row" key={u.id}>
                    <i className={u.status === 'error' ? 'ti ti-alert-circle upload-icon upload-icon--error' : /\.zip$/i.test(u.name) ? 'ti ti-folder-zip upload-icon' : 'ti ti-file-type-html upload-icon'}></i>
                    <div className="upload-info">
                      <span className="upload-name">{u.name}</span>

                    </span>
                  </div>

              })}
            </div>
          </section>
        )}

        <section className="how-it-works">
          <h2 className="section-title reveal">How it stays yours</h2>
          <p className="section-lead reveal">
            <span className="fraunces-italic">"Nothing you open here ever leaves the tab."</span>
          </p>
          <div className="card-grid">
            <div className="spotlight reveal">
              <i className="ti ti-database spotlight-icon"></i>
              <h3>Stored on-device</h3>
              <p>Every file is written straight into your browser's IndexedDB. Close the tab, restart your machine — it's still here.</p>
            </div>
            <div className="spotlight reveal">
              <i className="ti ti-shield-lock spotlight-icon"></i>
              <h3>Sandboxed by default</h3>
              <p>Previews run in an iframe with scripts allowed but storage access off, unless you explicitly flip it on for that file.</p>
            </div>
            <div className="spotlight reveal">
              <i className="ti ti-trash-x spotlight-icon"></i>
              <h3>Deletion means it</h3>
              <p>Delete sends a file to Trash first. Deleting forever asks you to confirm, then wipes the record for good.</p>
            </div>
          </div>
        </section>
      </main>

      <footer className="site-footer">
        <div>
          <span className="brand-mark brand-mark--sm">V</span>
          <span>Vellum v1.0 · runs entirely in this browser</span>
        </div>
        <div className="footer-meta">
          <span>Works best in Chromium, Firefox &amp; Safari with IndexedDB enabled</span>
          <span>Storage is shared with your browser's quota — usually several hundred MB to a few GB</span>
        </div>
      </footer>

      {drawer && (
        <div className="drawer-backdrop" onClick={function () { setDrawer(null); }}>
          <aside className={'drawer' + (drawer === 'trash' ? ' drawer--trash' : '')} onClick={function (e) { e.stopPropagation(); }}>
            <div className="drawer-head">
              <h2>{drawer === 'saved' ? 'Saved files' : 'Trash'}</h2>
              <button className="icon-btn" onClick={function () { setDrawer(null); }} aria-label="Close">
                <i className="ti ti-x"></i>
              </button>
            </div>

            {drawer === 'saved' && (
              <React.Fragment>
                <div className="drawer-search">
                  <i className="ti ti-search"></i>
                  <input
                    type="text"
                    placeholder="Search saved files"
                    value={search}
                    onChange={function (e) { setSearch(e.target.value); }}
                  />
                </div>
                <div className="drawer-list">
                  {visibleSaved.length === 0 && <p className="drawer-empty">No files match yet.</p>}
                  {visibleSaved.map(function (f) {
                    return (
                      <div className="file-row" key={f.id}>
                        <i className={'ti ' + (f.isZip ? 'ti-folder-zip' : 'ti-file-type-html') + ' file-row-icon'}></i>
                        <div className="file-row-info">
                          <span className="file-row-name">{f.name}</span>
                          <span className="file-row-meta">{fmtSize(f.size)} · opened {f.openCount || 0}×{f.isZip ? ' · project' : ''}</span>
                        </div>
                        <div className="file-row-actions">
                          <button className="btn btn-ghost btn-sm" onClick={function () { openFile(f); }}>
                            <i className="ti ti-player-play"></i> Open
                          </button>
                          <button className="btn btn-ghost btn-sm btn-danger" onClick={function () { moveToTrash(f); }}>
                            <i className="ti ti-trash"></i>
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </React.Fragment>
            )}

            {drawer === 'trash' && (
              <div className="drawer-list">
                {visibleTrash.length === 0 && <p className="drawer-empty">Trash is empty.</p>}
                {visibleTrash.map(function (f) {
                  return (
                    <div className="file-row" key={f.id}>
                      <i className="ti ti-file-type-html file-row-icon"></i>
                      <div className="file-row-info">
                        <span className="file-row-name">{f.name}</span>
                        <span className="file-row-meta">{fmtSize(f.size)} · trashed</span>
                      </div>
                      <div className="file-row-actions">
                        {confirmId === f.id ? (
                          <React.Fragment>
                            <button className="btn btn-ghost btn-sm" onClick={function () { setConfirmId(null); }}>Cancel</button>
                            <button className="btn btn-danger-solid btn-sm" onClick={function () { deleteForever(f.id); }}>Confirm</button>
                          </React.Fragment>
                        ) : (
                          <React.Fragment>
                            <button className="btn btn-ghost btn-sm" onClick={function () { restoreFile(f); }}>
                              <i className="ti ti-arrow-back-up"></i> Restore
                            </button>
                            <button className="btn btn-ghost btn-sm btn-danger" onClick={function () { setConfirmId(f.id); }}>
                              Delete forever
                            </button>
                          </React.Fragment>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </aside>
        </div>
      )}

      {preview && (
        <div className="preview-overlay">
          <div className="preview-head">
            <div className="preview-title">
              <i className={'ti ' + (preview.file.isZip ? 'ti-folder-zip' : 'ti-file-type-html')}></i>
              <span>{preview.file.name}</span>
            </div>
            <div className="preview-actions">
              <label className="storage-toggle">
                <input type="checkbox" checked={preview.allowStorage} onChange={togglePreviewStorage} onKeyDown={function (e) { if (e.code === 'Space') { e.preventDefault(); } }} />
                <span className="toggle-track"><span className="toggle-thumb"></span></span>
                <span>Allow storage access</span>
              </label>
              <button className="btn btn-ghost btn-sm" onClick={openInNewTab}>
                <i className="ti ti-external-link"></i> Open in new tab
              </button>
              <button className="icon-btn" onClick={closePreview} aria-label="Close preview">
                <i className="ti ti-x"></i>
              </button>
            </div>
          </div>
          <iframe
            key={preview.file.id + '-' + preview.allowStorage}
            className="preview-frame"
            src={preview.url}
            sandbox={preview.allowStorage ? 'allow-scripts allow-same-origin' : 'allow-scripts'}
            title={preview.file.name}
          ></iframe>
        </div>
      )}

      <div className="toast-wrap" id="toastWrap"></div>
    </React.Fragment>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false };
  }
  static getDerivedStateFromError() {
    return { hasError: true };
  }
  componentDidCatch(err) {
    console.error('App crashed:', err);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="crash-screen">
          <i className="ti ti-alert-triangle"></i>
          <h1>Something went wrong</h1>
          <p>Vellum hit an unexpected error. Your saved files are untouched — try reloading the page.</p>
          <button className="btn btn-primary" onClick={function () { window.location.reload(); }}>Reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

var rootEl = document.getElementById('root');

<script>
document.documentElement.classList.add('js');

// ---------- Toasts (vanilla, no CDN) ----------
(function () {
  var wrap = null;
  function getWrap() {
    if (!wrap || !document.body.contains(wrap)) {
      wrap = document.getElementById('toastWrap');
    }
    return wrap;
  }
  var ICONS = { success: 'ti-circle-check', error: 'ti-alert-circle', info: 'ti-info-circle' };
  window.showToast = function (msg, type) {
    var t = type && ICONS[type] ? type : 'info';
    var container = getWrap();
    if (!container) return;
    var el = document.createElement('div');
    el.className = 'toast toast--' + t;
    el.innerHTML = '<i class="ti ' + ICONS[t] + '"></i><span class="toast-msg"></span><button class="toast-close" aria-label="Dismiss"><i class="ti ti-x"></i></button>';
    el.querySelector('.toast-msg').textContent = msg;
    container.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    function dismiss() {
      el.classList.remove('show');
      el.classList.add('hide');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 350);
    }
    el.querySelector('.toast-close').addEventListener('click', dismiss);
    var timer = setTimeout(dismiss, 3500);
    el.addEventListener('mouseenter', function () { clearTimeout(timer); });
    el.addEventListener('mouseleave', function () { timer = setTimeout(dismiss, 1200); });
  };
})();

var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Scramble headline ----------
(function () {
  var el = document.getElementById('scrambleHeadline');
  if (!el) return;
  var chars = '!<>-_\\/[]{}=+*^?#';
  var raw = el.getAttribute('data-phrases') || el.textContent || '';
  var phrases = raw.split('|').filter(Boolean);
  if (!phrases.length) phrases = [el.textContent || ''];
  if (reduceMotion || phrases.length < 2) return;

  var idx = 0;
  var running = false;

  function scrambleTo(text) {
    if (running) return;
    running = true;
    var from = el.textContent || '';
    var len = Math.max(from.length, text.length);
    var start = null;
    var perCharDelay = 18;

    function frame(ts) {
      if (start === null) start = ts;
      var elapsed = ts - start;
      var out = '';
      for (var i = 0; i < len; i++) {
        var target = text[i];
        if (target === undefined) { continue; }
        var charStart = i * perCharDelay;
        if (elapsed < charStart) {
          out += from[i] || ' ';
        } else if (elapsed < charStart + 260) {
          out += chars[Math.floor(Math.random() * chars.length)];
        } else {
          out += target;
        }
      }
      el.textContent = out;
      if (elapsed < len * perCharDelay + 260) {
        requestAnimationFrame(frame);
      } else {
        el.textContent = text;
        running = false;
      }
    }
    requestAnimationFrame(frame);
  }

  setInterval(function () {
    idx = (idx + 1) % phrases.length;
    scrambleTo(phrases[idx]);
  }, 3200);
})();

// ---------- Cursor glow overlay ----------
(function () {
  var glow = document.getElementById('cursorGlow');
  if (!glow) return;
  if (reduceMotion || matchMedia('(pointer: coarse)').matches) {
    glow.style.display = 'none';
    return;
  }
  var ticking = false;
  var mx = 0, my = 0;
  window.addEventListener('mousemove', function (e) {
    mx = e.clientX; my = e.clientY;
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(function () {
        document.body.style.setProperty('--mx', mx + 'px');
        document.body.style.setProperty('--my', my + 'px');
        ticking = false;
      });
    }
  }, { passive: true });
})();

// ---------- Spotlight cards ----------
(function () {
  if (matchMedia('(pointer: coarse)').matches) return;
  document.addEventListener('mousemove', function (e) {
    var card = e.target.closest ? e.target.closest('.spotlight') : null;
    if (!card) return;
    var rect = card.getBoundingClientRect();
    card.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
    card.style.setProperty('--my', (e.clientY - rect.top) + 'px');
  }, { passive: true });
})();

// ---------- CountUp stats ----------
window.addEventListener('load', function () {
  try {
    if (!window.countUp || !window.countUp.CountUp) return;
    var targets = document.querySelectorAll('[data-to]');
    var io = new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var el = entry.target;
        var to = parseFloat(el.getAttribute('data-to') || '0');
        var suffix = el.getAttribute('data-suffix') || '';
        try {
          new window.countUp.CountUp(el, to, { duration: 2.2, separator: ',', suffix: suffix }).start();
        } catch (e) {}
        obs.unobserve(el);
      });
    }, { threshold: 0.4 });
    targets.forEach(function (el) { io.observe(el); });
  } catch (e) {
    console.error('CountUp init failed', e);
  }
});
</script>
